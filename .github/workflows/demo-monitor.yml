name: Monitor demo

# Co 6 godzin sprawdza publiczne demo (https://miniwms.twapp.pl): healthcheck z bazą,
# stronę główną (przekierowanie na logowanie) i ekran logowania z „Wejdź jako demo”.
# Za bramką portfolio (ForwardAuth, od 24.10) strony dają 401 z formularzem portfolio — to wynik
# poprawny (treści nie sprawdzamy); /healthz musi wtedy i tak zwrócić status=ok.
# Awaria → issue „Demo nie odpowiada” z etykietą `demo` (jedno, kolejne awarie jako
# komentarze); pierwszy udany przebieg po awarii → issue zamknięte.
on:
  schedule:
    - cron: "17 */6 * * *" # poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://miniwms.twapp.pl
  LABEL: demo

jobs:
  check:
    name: Demo online
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          get() { curl -sS -L --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$@"; }

          health=$(get -f "$DEMO_URL/healthz") || health=''
          [ "$(jq -r '.status // empty' <<<"$health" 2>/dev/null)" = ok ] \
            || problems+=("/healthz nie zwraca status=ok: ${health:0:200}")

          # Od 24.10 demo stoi za ForwardAuth portfolio: bez ciasteczka `gosc` strony dają 401
          # z formularzem bramki (link do portfolio.twapp.pl/wejscie) — to znaczy, że bramka działa,
          # a treści aplikacji nie widać. Dowodem życia aplikacji jest wtedy /healthz (ForwardAuth go
          # przepuszcza). Strony pobieramy bez -f (przy 401 -f nie oddałby treści) do page.html.
          page() { rm -f page.html; get -o page.html -w "$2" "$DEMO_URL$1" || true; }
          bramka() { [ "$1" = 401 ] && grep -qF 'portfolio.twapp.pl/wejscie' page.html 2>/dev/null; }
          za_bramka=''

          home=$(page / '%{http_code} %{url_effective}')
          if [[ "$home" == 200\ * ]]; then
            :
          elif bramka "${home%% *}"; then
            za_bramka=1
          else
            problems+=("Strona główna nie odpowiada (kod/adres: ${home:-brak odpowiedzi})")
          fi

          login=$(page /login/ '%{http_code}')
          if [ "$login" = 200 ]; then
            grep -q 'Wejdź jako demo' page.html \
              || problems+=("Ekran logowania bez przycisku „Wejdź jako demo”")
          elif bramka "$login"; then
            za_bramka=1
          else
            problems+=("Ekran logowania nie odpowiada (HTTP ${login:-brak odpowiedzi})")
          fi
          note=''
          [ -n "$za_bramka" ] && note=' Za bramką portfolio – sprawdzono tylko zdrowie.'

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo działa ($(date -u '+%Y-%m-%d %H:%M UTC')).$note" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL — problemy ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              [ -z "$note" ] || echo "-$note"
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: miniWMS-public" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1 # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów działa ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: miniWMS-public" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
