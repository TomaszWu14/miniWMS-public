name: security

# Skany bezpieczeństwa — bramki na każdym PR do main (czerwony = nie scalaj) oraz
# co miesiąc / ręcznie na całym repo:
#  - gitleaks (sekrety): PR — tylko jego commity; harmonogram — cała historia.
#    Fałszywe alarmy: .gitleaksignore (fingerprint + powód) albo `gitleaks:allow` w linii.
#  - Bandit (SAST Pythona): severity i confidence ≥ medium, konfiguracja [tool.bandit]
#    w pyproject.toml. Fałszywy alarm: `# nosec BXXX` + komentarz z powodem.
#  - Semgrep p/owasp-top-ten: znalezisko = czerwony; fałszywy alarm oznacz
#    `nosemgrep: <id-reguły>` z powodem obok.
#  - Trivy fs: HIGH/CRITICAL z dostępną poprawką (zależności, sekrety, konfiguracja).
#  - pip-audit: znane CVE w requirements*.txt.
# Narzędzia przypięte (wersja + sha256 dla binarek), akcje przypięte do SHA.
# Lokalnie: scripts/security_scan.sh.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"   # 1. dnia miesiąca
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalacja Bandit
        run: pip install "bandit[toml]==1.9.4"
      - name: Skan (błąd przy problemach ≥ średnie, pewność ≥ średnia)
        run: bandit -q -c pyproject.toml -r . -ll -ii

  gitleaks:
    name: gitleaks (sekrety)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks czyta commity (base..head PR-a albo całą historię)
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --no-banner)
          # PR: tylko jego commity; harmonogram/ręcznie: cała historia.
          if [ -n "$BASE" ]; then args+=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalacja Semgrep
        run: pip install "semgrep==1.181.0"
      - name: Semgrep p/owasp-top-ten (bramka)
        run: >-
          semgrep scan --config p/owasp-top-ten --metrics off --error --text
          warehouse config manage.py

  trivy:
    name: Trivy (zależności + konfiguracja)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalacja Trivy (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
      - name: Skan repozytorium (HIGH/CRITICAL z dostępną poprawką — bramka)
        run: >-
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --no-progress .

  pip-audit:
    name: pip-audit (CVE w zależnościach)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalacja pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: Audyt requirements.txt (obraz) i requirements-dev.txt (bramka)
        run: >-
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
