# Cotygodniowe PR-y z aktualizacjami zależności (Dependabot).
# Grupy minor+patch ograniczają liczbę PR-ów; major osobno (może wymagać zmian w kodzie).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Repo zostaje na Django 5.2 LTS — przejście na nową wersję główną to świadoma decyzja.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
